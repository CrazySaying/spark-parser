plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.8'
}

group = 'org.sparkparser'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.protobuf:protobuf-java:4.31.1'
    implementation 'com.google.code.gson:gson:2.11.0'
}

shadowJar {
    archiveClassifier = ''
    mergeServiceFiles()
    manifest {
        attributes 'Main-Class': 'org.sparkparser.SparkParser'
    }
}

tasks.named('build') {
    dependsOn shadowJar
}
